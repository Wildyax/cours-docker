services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks: [internal]

  frontend-js:
    build: ./frontend-js
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    depends_on: [backend]
    ports:
      - "${FRONTEND_JS_PORT:-8080}:8080"
    networks: [internal]

  frontend-ts:
    build: ./frontend-ts
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    depends_on: [backend]
    ports:
      - "${FRONTEND_TS_PORT:-8081}:8080"
    networks: [internal]

volumes:
  db-data:

networks:
  internal:

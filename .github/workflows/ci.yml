name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend (pytest + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: pytest -v
        working-directory: backend

  frontend-checks:
    name: Frontends (typecheck + syntaxe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-ts/package-lock.json
      - name: TypeScript (tsc strict)
        working-directory: frontend-ts
        run: |
          npm ci
          npm run build
      - name: JavaScript (syntaxe)
        run: node --check frontend-js/public/app.js

  docker-e2e:
    name: Build Docker + test de bout en bout
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-checks]
    steps:
      - uses: actions/checkout@v4
      - name: Créer un .env de CI
        run: cp .env.example .env
      - name: Build et démarrage de la stack
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Smoke tests via chaque frontend
        run: |
          set -e
          for port in 8080 8081; do
            curl -fsS "localhost:$port/" | grep -q "Mes tâches"
            curl -fsS -X POST "localhost:$port/api/todos" \
              -H 'Content-Type: application/json' \
              -d '{"title":"ci","priority":"high"}' | grep -q '"title":"ci"'
          done
          # Les deux fronts partagent la même base
          test "$(curl -fsS localhost:8080/api/todos | grep -o '"title":"ci"' | wc -l)" = 2
      - name: Logs en cas d'échec
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
